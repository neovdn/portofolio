<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <!-- Minimalist High-Craft Monochromatic Portrait Representation -->
  <rect width="400" height="480" fill="#1C1C1C" />
  
  <!-- Subtle Background Pattern -->
  <pattern id="dot-pat" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#333333" />
  </pattern>
  <rect width="400" height="480" fill="url(#dot-pat)" opacity="0.8" />

  <!-- Geometric Abstract Silhouette of Developer -->
  <g transform="translate(200, 230)">
    <!-- Shoulders & Torso -->
    <path d="M -110, 250 C -100, 150, -60, 100, -30, 80 L 30, 80 C 60, 100, 100, 150, 110, 250 Z" fill="#292929" />
    
    <!-- Neck -->
    <rect x="-24" y="30" width="48" height="60" rx="4" fill="#3A3A3A" />
    
    <!-- Head / Jaw Shape -->
    <path d="M -50, -30 C -50, -90, -35, -130, 0, -130 C 35, -130, 50, -90, 50, -30 C 50, 25, 25, 55, 0, 55 C -25, 55, -50, 25, -50, -30 Z" fill="#404040" />
    
    <!-- Hairline / Stylized cut -->
    <path d="M -52, -40 C -55, -100, -35, -145, 0, -145 C 38, -145, 58, -100, 54, -40 C 42, -90, 10, -115, -20, -110 C -40, -105, -48, -80, -52, -40 Z" fill="#151515" />

    <!-- Minimalist Glasses / Frame -->
    <rect x="-42" y="-45" width="36" height="24" rx="4" fill="none" stroke="#D9D9D9" stroke-width="2.5" />
    <rect x="6" y="-45" width="36" height="24" rx="4" fill="none" stroke="#D9D9D9" stroke-width="2.5" />
    <line x1="-6" y1="-33" x2="6" y2="-33" stroke="#D9D9D9" stroke-width="2.5" />
    
    <!-- Subtle Collar / Minimal Layer -->
    <polygon points="-30,80 0,130 30,80 0,90" fill="#111111" />
  </g>

  <!-- Technical Overlay Elements (Minimal) -->
  <rect x="20" y="20" width="360" height="440" fill="none" stroke="#333333" stroke-width="1" />
  <circle cx="30" cy="30" r="3" fill="#D9D9D9" />
  <circle cx="370" cy="30" r="3" fill="#D9D9D9" />
  <circle cx="30" cy="450" r="3" fill="#D9D9D9" />
  <circle cx="370" cy="450" r="3" fill="#D9D9D9" />
  
  <text x="32" y="440" fill="#737373" font-family="monospace" font-size="10" letter-spacing="1">NEO // 2026</text>
  <text x="368" y="440" fill="#10B981" font-family="monospace" font-size="10" text-anchor="end">DEV_ONLINE</text>
</svg>
