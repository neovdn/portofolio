<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="1200" height="750" fill="#EBEBE8" />
  
  <pattern id="grid-cv" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9D9D9" stroke-width="1" />
  </pattern>
  <rect width="1200" height="750" fill="url(#grid-cv)" opacity="0.6" />

  <!-- Studio Showcase Frame -->
  <g transform="translate(100, 75)">
    <rect width="1000" height="600" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.04))" />
    
    <!-- Top Bar -->
    <rect width="1000" height="48" rx="12" fill="#F9F9F8" stroke="#D9D9D9" stroke-width="1" />
    <circle cx="28" cy="24" r="5" fill="#D9D9D9" />
    <circle cx="44" cy="24" r="5" fill="#D9D9D9" />
    <circle cx="60" cy="24" r="5" fill="#D9D9D9" />
    <text x="500" y="30" fill="#737373" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">CODEVELA STUDIO · ENGINEERING &amp; PRODUCT CRAFTSMANSHIP</text>
    
    <!-- Studio Header Area -->
    <g transform="translate(48, 72)">
      <text x="0" y="32" fill="#111111" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">CODEVELA</text>
      <text x="0" y="56" fill="#737373" font-family="monospace" font-size="12">DIGITAL PRODUCT STUDIO &amp; CLIENT ENGINEERING</text>

      <rect x="740" y="8" width="164" height="40" rx="6" fill="#111111" />
      <text x="822" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">codevela.dev ↗</text>
    </g>

    <!-- 3 Pillar Capability Cards -->
    <g transform="translate(48, 150)">
      <!-- Card 1: Web Engineering -->
      <rect width="280" height="380" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="24" y="40" fill="#737373" font-family="monospace" font-size="11">01 / ARCHITECTURE</text>
      <text x="24" y="68" fill="#111111" font-family="sans-serif" font-size="18" font-weight="700">Web Platforms</text>
      <text x="24" y="96" fill="#737373" font-family="sans-serif" font-size="12" line-height="18">Custom full-stack web applications with Next.js, TypeScript, PostgreSQL, and scalable API layers.</text>
      
      <!-- Tech pills -->
      <rect x="24" y="160" width="80" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
      <text x="64" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Next.js</text>
      <rect x="112" y="160" width="100" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
      <text x="162" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">TypeScript</text>

      <rect x="24" y="196" width="90" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
      <text x="69" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Supabase</text>
      <rect x="122" y="196" width="90" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
      <text x="167" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Postgres</text>

      <rect x="24" y="320" width="232" height="36" rx="6" fill="#111111" />
      <text x="140" y="343" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Production Deployed</text>

      <!-- Card 2: Mobile Ecosystem -->
      <g transform="translate(312, 0)">
        <rect width="280" height="380" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
        <text x="24" y="40" fill="#737373" font-family="monospace" font-size="11">02 / INTERACTION</text>
        <text x="24" y="68" fill="#111111" font-family="sans-serif" font-size="18" font-weight="700">Mobile Solutions</text>
        <text x="24" y="96" fill="#737373" font-family="sans-serif" font-size="12">Cross-platform iOS and Android mobile software engineered with Flutter and React Native.</text>

        <rect x="24" y="160" width="80" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="64" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Flutter</text>
        <rect x="112" y="160" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="142" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Dart</text>

        <rect x="24" y="196" width="110" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="79" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">React Native</text>
        <rect x="142" y="196" width="90" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="187" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Firebase</text>

        <rect x="24" y="320" width="232" height="36" rx="6" fill="#111111" />
        <text x="140" y="343" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multi-Platform Sync</text>
      </g>

      <!-- Card 3: Enterprise & AI Integration -->
      <g transform="translate(624, 0)">
        <rect width="280" height="380" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
        <text x="24" y="40" fill="#737373" font-family="monospace" font-size="11">03 / INTELLIGENCE</text>
        <text x="24" y="68" fill="#111111" font-family="sans-serif" font-size="18" font-weight="700">AI Integrations</text>
        <text x="24" y="96" fill="#737373" font-family="sans-serif" font-size="12">Autonomous agents, workflow orchestrations, and LLM-powered enterprise tooling.</text>

        <rect x="24" y="160" width="100" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="74" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">LangChain</text>
        <rect x="132" y="160" width="80" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="172" y="177" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">GPT-4</text>

        <rect x="24" y="196" width="120" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="84" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">ReAct Agents</text>
        <rect x="152" y="196" width="80" height="26" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
        <text x="192" y="213" fill="#111111" font-family="monospace" font-size="10" text-anchor="middle">Docker</text>

        <rect x="24" y="320" width="232" height="36" rx="6" fill="#111111" />
        <text x="140" y="343" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">End-to-End Delivery</text>
      </g>
    </g>
  </g>
</svg>
