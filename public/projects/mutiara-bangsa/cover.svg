<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="1200" height="750" fill="#EBEBE8" />
  
  <pattern id="grid-mb" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9D9D9" stroke-width="1" />
  </pattern>
  <rect width="1200" height="750" fill="url(#grid-mb)" opacity="0.6" />

  <!-- Main Window Frame -->
  <g transform="translate(100, 75)">
    <rect width="1000" height="600" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.04))" />
    
    <!-- Header -->
    <rect width="1000" height="48" rx="12" fill="#F9F9F8" stroke="#D9D9D9" stroke-width="1" />
    <circle cx="28" cy="24" r="5" fill="#D9D9D9" />
    <circle cx="44" cy="24" r="5" fill="#D9D9D9" />
    <circle cx="60" cy="24" r="5" fill="#D9D9D9" />
    <text x="500" y="30" fill="#737373" font-family="monospace" font-size="12" font-weight="500" text-anchor="middle">MUTIARA BANGSA · COMMERCE &amp; DEMAND FORECASTING</text>
    
    <!-- Top KPI Row -->
    <g transform="translate(40, 75)">
      <rect width="210" height="85" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="16" y="28" fill="#737373" font-family="sans-serif" font-size="11" font-weight="500">Monthly Sales Volume</text>
      <text x="16" y="60" fill="#111111" font-family="sans-serif" font-size="22" font-weight="700">Rp 184.5M</text>

      <rect x="236" y="0" width="210" height="85" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="252" y="28" fill="#737373" font-family="sans-serif" font-size="11" font-weight="500">Forecast Accuracy</text>
      <text x="252" y="60" fill="#111111" font-family="sans-serif" font-size="22" font-weight="700">92.8%</text>

      <rect x="472" y="0" width="210" height="85" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="488" y="28" fill="#737373" font-family="sans-serif" font-size="11" font-weight="500">Stockout Risk Alerts</text>
      <text x="488" y="60" fill="#111111" font-family="sans-serif" font-size="22" font-weight="700">3 SKUs</text>

      <rect x="708" y="0" width="212" height="85" rx="8" fill="#111111" />
      <text x="724" y="28" fill="#B5B5B2" font-family="sans-serif" font-size="11" font-weight="500">Automated Reorder</text>
      <text x="724" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Active Engine ↗</text>
    </g>

    <!-- Chart & Table Split -->
    <g transform="translate(40, 185)">
      <!-- Left Chart: Demand Velocity vs Real Stock -->
      <rect width="530" height="360" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="24" y="36" fill="#111111" font-family="sans-serif" font-size="14" font-weight="600">Historical Velocity vs 30-Day Predictive Demand</text>
      <text x="24" y="56" fill="#737373" font-family="monospace" font-size="11">MODEL: EXPONENTIAL MOVING AVERAGE</text>
      
      <!-- Chart lines -->
      <line x1="40" y1="300" x2="490" y2="300" stroke="#E5E5E5" stroke-width="1" />
      <line x1="40" y1="240" x2="490" y2="240" stroke="#E5E5E5" stroke-width="1" />
      <line x1="40" y1="180" x2="490" y2="180" stroke="#E5E5E5" stroke-width="1" />
      <line x1="40" y1="120" x2="490" y2="120" stroke="#E5E5E5" stroke-width="1" />

      <!-- Actual Sales Polyline -->
      <polyline points="40,260 100,240 160,210 220,230 280,180 340,160 400,130 490,95" fill="none" stroke="#111111" stroke-width="2.5" />
      
      <!-- Predicted Polyline (Dashed) -->
      <polyline points="340,160 400,140 450,110 490,80" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 4" />
      
      <circle cx="490" cy="95" r="4" fill="#111111" />
      <circle cx="490" cy="80" r="4" fill="#737373" />

      <text x="40" y="325" fill="#737373" font-family="monospace" font-size="10">WK 01</text>
      <text x="160" y="325" fill="#737373" font-family="monospace" font-size="10">WK 04</text>
      <text x="280" y="325" fill="#737373" font-family="monospace" font-size="10">WK 08</text>
      <text x="400" y="325" fill="#737373" font-family="monospace" font-size="10">WK 12</text>
      <text x="470" y="325" fill="#111111" font-family="monospace" font-size="10">PROJECTED</text>

      <!-- Right Table: Stock Thresholds -->
      <g transform="translate(550, 0)">
        <rect width="370" height="360" rx="8" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
        <text x="20" y="36" fill="#111111" font-family="sans-serif" font-size="14" font-weight="600">Reorder Thresholds</text>
        
        <!-- Table Rows -->
        <g transform="translate(20, 60)">
          <!-- Row 1 -->
          <rect width="330" height="55" rx="6" fill="#FFFFFF" stroke="#EBEBE8" stroke-width="1" />
          <text x="14" y="24" fill="#111111" font-family="sans-serif" font-size="12" font-weight="600">Batik Sutra Premium</text>
          <text x="14" y="42" fill="#737373" font-family="monospace" font-size="10">Stock: 12 pcs · Depletion: 4 days</text>
          <rect x="240" y="14" width="76" height="26" rx="4" fill="#111111" />
          <text x="278" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Reorder</text>

          <!-- Row 2 -->
          <rect y="65" width="330" height="55" rx="6" fill="#FFFFFF" stroke="#EBEBE8" stroke-width="1" />
          <text x="14" y="89" fill="#111111" font-family="sans-serif" font-size="12" font-weight="600">Kemeja Formal V2</text>
          <text x="14" y="107" fill="#737373" font-family="monospace" font-size="10">Stock: 48 pcs · Depletion: 18 days</text>
          <rect x="240" y="79" width="76" height="26" rx="4" fill="#F5F5F3" stroke="#D9D9D9" stroke-width="1" />
          <text x="278" y="96" fill="#737373" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Healthy</text>

          <!-- Row 3 -->
          <rect y="130" width="330" height="55" rx="6" fill="#FFFFFF" stroke="#EBEBE8" stroke-width="1" />
          <text x="14" y="154" fill="#111111" font-family="sans-serif" font-size="12" font-weight="600">Tenun Troso Handwoven</text>
          <text x="14" y="172" fill="#737373" font-family="monospace" font-size="10">Stock: 8 pcs · Depletion: 2 days</text>
          <rect x="240" y="144" width="76" height="26" rx="4" fill="#111111" />
          <text x="278" y="161" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Critical</text>

          <!-- Row 4 -->
          <rect y="195" width="330" height="55" rx="6" fill="#FFFFFF" stroke="#EBEBE8" stroke-width="1" />
          <text x="14" y="219" fill="#111111" font-family="sans-serif" font-size="12" font-weight="600">Outer Linen Casual</text>
          <text x="14" y="237" fill="#737373" font-family="monospace" font-size="10">Stock: 86 pcs · Depletion: 45 days</text>
          <rect x="240" y="209" width="76" height="26" rx="4" fill="#F5F5F3" stroke="#D9D9D9" stroke-width="1" />
          <text x="278" y="226" fill="#737373" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Overstock</text>
        </g>
      </g>
    </g>
  </g>
</svg>
