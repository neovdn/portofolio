<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="1200" height="750" fill="#EBEBE8" />
  
  <pattern id="grid-mg" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9D9D9" stroke-width="1" />
  </pattern>
  <rect width="1200" height="750" fill="url(#grid-mg)" opacity="0.6" />

  <!-- Dual Phone Presentation Mockup Frame -->
  <g transform="translate(230, 45)">
    <!-- Left Phone: Geofence Map View -->
    <g transform="translate(0, 0)">
      <!-- Phone Body -->
      <rect width="330" height="660" rx="36" fill="#111111" stroke="#2B2B2B" stroke-width="6" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.08))" />
      
      <!-- Phone Screen -->
      <rect x="12" y="12" width="306" height="636" rx="26" fill="#FFFFFF" />
      
      <!-- Dynamic Island / Speaker Notch -->
      <rect x="110" y="22" width="110" height="22" rx="11" fill="#111111" />
      
      <!-- App Top Bar -->
      <text x="32" y="76" fill="#111111" font-family="sans-serif" font-size="16" font-weight="700">MigasKita</text>
      <circle cx="280" cy="72" r="14" fill="#F5F5F3" />
      <circle cx="280" cy="72" r="5" fill="#111111" />

      <!-- Map Container Box -->
      <rect x="24" y="96" width="282" height="340" rx="16" fill="#F9F9F8" stroke="#D9D9D9" stroke-width="1" />
      
      <!-- Geofence Polygon on Map -->
      <polygon points="44,140 240,160 270,360 80,390" fill="rgba(17, 17, 17, 0.05)" stroke="#111111" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="160" cy="250" r="8" fill="#10B981" />
      <circle cx="160" cy="250" r="18" fill="rgba(16, 185, 129, 0.2)" />
      
      <!-- Location Chip -->
      <rect x="40" y="112" width="220" height="34" rx="17" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
      <circle cx="56" cy="129" r="4" fill="#10B981" />
      <text x="68" y="133" fill="#111111" font-family="monospace" font-size="10" font-weight="600">STATION #4 - CEPU FIELD</text>

      <!-- Status Card -->
      <rect x="24" y="452" width="282" height="110" rx="12" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="40" y="478" fill="#737373" font-family="sans-serif" font-size="11">GPS Accuracy: ±2.4m</text>
      <text x="40" y="500" fill="#111111" font-family="sans-serif" font-size="14" font-weight="700">Inside Operational Zone</text>
      <text x="40" y="522" fill="#10B981" font-family="monospace" font-size="11">✓ Anti-Spoofing Passed</text>
      <text x="40" y="542" fill="#737373" font-family="monospace" font-size="10">07:42 WIB · SHIFT MORNING</text>

      <!-- Action Button -->
      <rect x="24" y="576" width="282" height="48" rx="10" fill="#111111" />
      <text x="165" y="605" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Proceed to Selfie Verification</text>
    </g>

    <!-- Right Phone: Selfie & Verification Screen -->
    <g transform="translate(410, 0)">
      <!-- Phone Body -->
      <rect width="330" height="660" rx="36" fill="#111111" stroke="#2B2B2B" stroke-width="6" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.08))" />
      
      <!-- Phone Screen -->
      <rect x="12" y="12" width="306" height="636" rx="26" fill="#FFFFFF" />
      
      <!-- Dynamic Island / Speaker Notch -->
      <rect x="110" y="22" width="110" height="22" rx="11" fill="#111111" />
      
      <!-- Header -->
      <text x="32" y="76" fill="#111111" font-family="sans-serif" font-size="16" font-weight="700">Selfie Validation</text>
      
      <!-- Camera Viewport Box -->
      <g transform="translate(24, 96)">
        <rect width="282" height="340" rx="16" fill="#181818" />
        
        <!-- Face Oval Guide -->
        <ellipse cx="141" cy="150" rx="65" ry="85" fill="none" stroke="#D9D9D9" stroke-width="1.5" stroke-dasharray="6 4" />
        
        <!-- Live Watermark Overlay -->
        <rect x="12" y="270" width="258" height="58" rx="8" fill="rgba(0, 0, 0, 0.6)" />
        <text x="24" y="292" fill="#FFFFFF" font-family="monospace" font-size="10">USER: EMP-9042 (FIELD ENG)</text>
        <text x="24" y="308" fill="#10B981" font-family="monospace" font-size="9">LOC: -7.1524, 111.5902 (CEPU)</text>
        <text x="24" y="322" fill="#B5B5B2" font-family="monospace" font-size="9">2026-08-24 07:42:15 WIB</text>
      </g>

      <!-- Biometric Match Status -->
      <rect x="24" y="452" width="282" height="110" rx="12" fill="#FDFCFA" stroke="#D9D9D9" stroke-width="1" />
      <text x="40" y="478" fill="#737373" font-family="sans-serif" font-size="11">Biometric Anti-Spoof</text>
      <text x="40" y="500" fill="#111111" font-family="sans-serif" font-size="14" font-weight="700">Liveness Confirmed</text>
      <text x="40" y="522" fill="#10B981" font-family="monospace" font-size="11">✓ Match Confidence: 99.4%</text>
      <text x="40" y="542" fill="#737373" font-family="monospace" font-size="10">Synced to Cloud Firestore</text>

      <!-- Submit Check-in Button -->
      <rect x="24" y="576" width="282" height="48" rx="10" fill="#10B981" />
      <text x="165" y="605" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Check-In Successful ✓</text>
    </g>
  </g>
</svg>
